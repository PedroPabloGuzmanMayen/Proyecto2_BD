services:
  mongo:
    image: mongo:7.0
    container_name: proyecto2-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: proyecto2
    volumes:
      - db-data:/data/db
      - ./backend:/data/seed:ro
      - ./docker/mongo/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data: