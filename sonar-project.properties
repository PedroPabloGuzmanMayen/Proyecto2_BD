# ============================================================
# SonarQube - Proyecto2_BD (frontend React/Vite + API Node/Express)
# Laboratorio DAST - Curso Desarrollo Seguro
# ============================================================

# --- Identificacion del proyecto ---
sonar.projectKey=grupo5-restaurante
sonar.projectName=grupo5-restaurante
sonar.projectVersion=fase2
sonar.host.url=http://localhost:9000

# Codigo a analizar: front y API
sonar.sources=frontend/src,backend/src
sonar.sourceEncoding=UTF-8

# --- Exclusiones ---
# Dependencias, builds, datos de prueba y archivos
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.json,\
  **/*.svg,\
  **/*.css,\
  **/assets/**


sonar.tests=backend/tests
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# --- Semgrep ---
sonar.sarifReportPaths=semgrep.sarif